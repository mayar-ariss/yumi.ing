<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YuMi</title>
<meta name="description" content="Send a Yumi. It opens when they send one back. Out of sync, it stays hidden. In sync, that's yumiing.">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#080708" media="(prefers-color-scheme:dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 450 489'><path d='M16 251.6V16M16 16 224.5 131.8M433 251.6V16M224.5 131.8 433 16M224.5 131.8V472.3M16 251.6 224.5 367.4M224.5 367.4 433 251.6' fill='none' stroke='%2346b83d' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ── Tokens ───────────────────────────────────────────────────────────
   Nine tokens, not twelve. Green is spent in exactly three places and
   every one of them means "a match": the 2.6s pulse, the word yumiing,
   and the system affordances (selection, focus ring). The ground is
   never green — the old .glow washed rgba(70,184,61,.14) over the page
   from frame 0, so the 8.2s pulse fired green-on-green and the one
   engineered event of the page registered as a brightening. */
:root{
  color-scheme:dark;
  --ground:#080708;
  --text:#f2f3f2;                    /* not #fff: round caps halate on OLED */
  --text-2:rgba(242,243,242,.62);    /* 7.1:1 on the ground */
  --accent:#46b83d;                  /* 7.84:1 on the ground */
  --accent-text:#46b83d;             /* the brand green itself, not a tint */
  --accent-ink:#06230a;
  --pulse:rgba(70,184,61,.34);
  --pulse-core:rgba(70,184,61,.62);
  --speck-ink:#f2f3f2;
  --speck-k:1;
  --hair:rgba(242,243,242,.34);

  /* -- THE SPINE ---------------------------------------------------
     The I never turns and never moves; it is the still thing the other
     three come into sync WITH. Extended to page scale it becomes the
     axis every other element is measured from - the mark's centre sits
     on it, and so does the left edge of every line of type. Nothing on
     this page is centred on the viewport any more.
     --ls moves up here from .stage because --rail is derived from it.
     The 1.8 factor is not taste: the match pulse fades to nothing at
     1.716 x --ls from the mark's centre, so any rail tighter than that
     clips the one green event on the page against the left edge of the
     screen. 22vw takes over on wide screens, where a rail pinned to the
     letter box would leave the composition stranded in the corner. */
  --ls:clamp(52px, min(11.5svh, 8.6vw), 168px);
  --rail:clamp(96px, max(calc(var(--ls) * 1.8), 22vw), 460px);
}
/* #46b83d on the light ground is 2.41:1 — it fails even the large-text
   floor, so light gets a luminance-corrected sibling at the same hue.
   (#2e8c27, used before, measures 4.04:1 and fails AA for body text;
   #2a8123 measures 4.64:1 and passes at every size.) */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ground:#f7f8fa;
    --text:#0d0e0d;
    --text-2:rgba(13,14,13,.62);
    --accent:#46b83d;
    --accent-text:#2a8123;
    --accent-ink:#06230a;
    --pulse:rgba(70,184,61,.26);
    --pulse-core:rgba(70,184,61,.46);
    --speck-ink:#0d0e0d;
    --speck-k:.72;
    --hair:rgba(13,14,13,.34);                   /* dark ink on light reads heavier */
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#f7f8fa;
  --text:#0d0e0d;
  --text-2:rgba(13,14,13,.62);
  --accent:#46b83d;
  --accent-text:#2a8123;
  --accent-ink:#06230a;
  --pulse:rgba(70,184,61,.26);
  --pulse-core:rgba(70,184,61,.46);
  --speck-ink:#0d0e0d;
  --speck-k:.72;
  --hair:rgba(13,14,13,.34);
}

/* ── Base ─────────────────────────────────────────────────────────────
   The ground lives on <html>, not <body>: a background on body
   propagates to the canvas and paints in front of anything at a
   negative z-index, which would hide the speck field completely. */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ground)}
body{
  background:none;
  min-height:100svh;
  color:var(--text);
  /* Helvetica, and nothing to fetch. The stack is four names for one
     letterform: Helvetica Neue on macOS and iOS, Helvetica where it is
     installed, Arial on Windows — drawn in 1982 to Helvetica's exact
     metrics, so a line breaks identically on both — and Liberation Sans
     for the same reason on Linux. Android has none of them and maps all
     four to Roboto, which is the one real variance and is narrow by
     about a percent. No webfont means no swap, so the metric-matched
     @font-face this stack replaced has nothing left to protect: the
     first frame is already the final face. */
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:2px}

/* ── The field — the app's own backdrop, brought to the web ───────────
   welcome.tsx renders two full-bleed halves of drifting monogram
   specks: the left half falls, the right half rises and is flipped
   180° so the chevron reads with its flow in both directions. Two
   opposing streams — the reciprocity mechanic as ambient texture.
   It is the ROOM, not an actor: no timeline, no reaction to the sync,
   nothing to upstage the centre. It simply never stops.

   The app runs 210 specks per half at 6–12px on a DPR-3 phone. On a
   desktop browser at DPR 1 that size puts the 32.0833/489 stroke below
   one physical pixel and the field renders as grey dust, so the web
   values are re-derived: 16–24px (stroke 1.05–1.57px), 32 per half,
   alpha 0.13–0.30, 19–33s per pass — nothing may be faster than the
   10.4s ritual. Slow is what reads expensive.

   The mask is the whole safety argument: a permanent elliptical quiet
   zone means no speck can ever cross the mark or a line of type at any
   viewport, geometrically rather than probabilistically. */
.field{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  contain:layout paint style;
  /* The ellipse is gone. It was centred on the viewport, and the
     content no longer is - so it protected the wrong place, and even
     under the old centred layout it failed above ~1500px tall, where
     it caps at 46rem while the copy keeps spreading: measured, .status
     sat at 40% mask on a 1728x1117 screen with specks crossing it.
     The zone is now derived from the same two numbers as the layout.
     The content column runs from the mark's left extent (1.9 x --ls
     left of the rail, which clears the 1.716 pulse) to the right edge
     of the copy. Everything outside that is open ground, and there is
     open ground on BOTH sides, so the two streams both survive: .half.l
     still falls down the narrow left margin, .half.r rises through the
     wide right one. */
  --qL:calc(var(--rail) - var(--ls) * 1.9);
  --qR:calc(var(--rail) + min(30rem, calc(100vw - var(--rail) - 24px)) + 24px);
  --quiet:linear-gradient(to right,
          #000 0, #000 calc(var(--qL) * .5), transparent var(--qL),
          transparent var(--qR), #000 calc(var(--qR) + 56px), #000 100%);
  -webkit-mask-image:var(--quiet);mask-image:var(--quiet);
}
/* The axis, made visible, and drawn. One device-pixel line at 12% -
   present enough to register as structure, faint enough that it never
   competes with a 7.1% monoline mark.
   It traces from top to bottom at a CONSTANT rate, and every line of
   copy arrives as the line reaches it, so the page's vertical axis and
   its timeline become the same axis. The rate is not a taste decision:
   the headline must still hard-cut on the 8.2s pulse frame, so the
   line has to be AT the headline at 8.2s. That fixes the speed, and
   every other delay falls out of it. linear, because a line being drawn
   at a varying speed is a line being drawn by something anxious.
   The duration and the three delays below are the JavaScript-off
   defaults, measured at 390x844; the script at the foot of the page
   re-derives them from the real positions at the real viewport. */
.rail{
  position:fixed;left:var(--rail);top:0;bottom:0;width:1px;
  z-index:0;pointer-events:none;
  background:var(--text);opacity:.12;
  transform-origin:0 0;transform:scaleY(0);
  animation:trace 11.4s linear both;
}
@keyframes trace{to{transform:scaleY(1)}}

.half{
  position:absolute;top:0;bottom:0;left:0;width:50%;
  overflow:hidden;                 /* load-bearing: it is what makes two
                                      directions read as two streams */
  color:var(--speck-ink);
}
.half.l{left:0}
.half.r{left:50%}
.sp{
  position:absolute;top:0;
  width:var(--s);height:var(--s);
  opacity:calc(var(--a) * var(--speck-k));
  animation:drift var(--d) linear var(--o) infinite;
}
.sp svg{width:100%;height:100%;display:block}
/* Independent transform properties: drift and flip compose without
   either having to restate the other. */
.half.r .sp{rotate:180deg;animation-direction:reverse}
@keyframes drift{
  from{translate:0 -40px}
  to{translate:0 calc(100svh + 40px)}
}
/* On a phone the desktop quiet zone is not too small — it is too big.
   The ellipse is min(52rem,92vw) wide, and 92vw of a 390px screen is
   359px against a 195px half-viewport, so every speck sits inside the
   transparent core and the field renders as nothing. Hiding it was the
   honest response to that, but the answer is a different quiet zone,
   not the absence of one.
   The phone has no room BESIDE the content — the copy column is 342 of
   390px — so the only free ground is above and below it. The ellipse
   gives way to a vertical band, and the band is derived from the
   measured composition rather than guessed: the content stack settles
   at ~470px tall and is centred, so (100svh − 540px)/2 is the free
   margin with 35px of clearance held back at every portrait size from
   320×568 (24px of band) to 430×932 (196px). The mark and every line
   of type stay geometrically unreachable, which was the whole point of
   the mask.
   Size and count come down with it. The 16–24px web values exist to
   drag the 7.1% stroke above one physical pixel at DPR 1; a phone runs
   DPR 2–3, where 0.6× lands the same stroke on 2+ device pixels — so
   ~10–14px reads sharper here than 20px does on a desktop, and is what
   the app itself uses. Halving the count to 16 per half keeps the two
   streams legible at a third of the width. */
@media (max-width:820px) and (orientation:portrait){
  .field{
    --band:max(24px, calc((100svh - 620px) / 2));
    --quiet:linear-gradient(to bottom,
            #000 0, #000 calc(var(--band) * .4), transparent var(--band),
            transparent calc(100% - var(--band)),
            #000 calc(100% - var(--band) * .4), #000 100%);
  }
  .sp{width:calc(var(--s) * .6);height:calc(var(--s) * .6)}
  .sp:nth-child(2n){display:none}
}

main{
  position:relative;z-index:1;
  min-height:100svh;
  display:grid;grid-template-rows:.78fr auto 1.22fr;
  justify-items:start;align-items:center;
  text-align:left;
  padding-inline:0;                  /* the rail is the left margin now */
  padding-block:clamp(16px,3svh,48px);
}
.block{
  grid-row:2;
  display:flex;flex-direction:column;align-items:flex-start;
  margin-left:var(--rail);
  width:min(30rem, calc(100vw - var(--rail) - 24px));
}

/* ── The sync ritual — the page IS the mechanic ───────────────────────
   Yu descends first, then M — while the I holds still and everything
   comes down to it. Rotation and travel live on SEPARATE elements so
   the spin never stops: the outer .lt flies (translate + scale,
   ease-in-out), while the inner .spin carries ONE unbroken rotation
   from spin-up to final rest — spun up once, spun down once. The
   descents are gradual and sequential: Y goes first, then U, then M,
   at even 0.4s intervals, each a slow 5s glide (gentle sine-like
   ease, low peak speed). The spin is a staggered crescendo under
   constant angular acceleration: Y, U and M START TURNING in
   sequence at even 1s intervals — 1.2s, 2.2s, 3.2s — and each builds
   from a standstill along the same curve, cubic-bezier
   (1/3,0,2/3,1/3), which is exactly θ = ½αt²: speed rises linearly,
   never in a lurch. The later a letter starts, the harder it
   accelerates (Y 103°/s², U 120, M 144), so all three arrive together
   at 720°/s — two turns a second — precisely at the 8.2s sync, having
   covered 7/6/5 turns over very different windows so their phases
   stay scrambled until they coincide there for the first time. The I
   never turns at all: it is the still reference the others come into
   sync WITH, square to the viewer from the first frame to the last.
   The final 720° (2.2s) is identical for the three and picks up at
   exactly that speed: the aligned letters spend the momentum as one
   logo, decelerating onto the waiting I. That instant is
   the match — the green pulse, the monogram legible for the first
   time. Out of sync, hidden; in sync, a match: the rotation is the
   product mechanic, drawn.
   Landing geometry: the I never moves — its stacked slot is its final
   place, and the monogram is anchored on its bar. Y, U and M descend
   onto it, each landing at the exact position and scale that puts its
   strokes into the composite's 450×489 space at the I's scale
   (--tx/--ty/--sc, derived from the SVG geometry), stroke-for-stroke,
   stroke-width-for-stroke-width. The assembled letters simply ARE the
   logo, resting where the I always was.
   Stage proportion: --sh is pinned to 5×--ls, which fixes the gap
   between letters at exactly 0.2×--ls at every viewport. The old
   clamp(300px,44vh,420px) collapsed it to 7.2px at 1440×900 — four
   letters nearly touching in the page's opening frame. Every landing
   offset is slot-pitch plus a multiple of --ls, so --tx/--ty/--sc and
   both renderers are invariant under the change. With --sh = 5×--ls
   the landing anchor 4g + 3.346ls sits at 82.9% of the stage, so
   perspective-origin 50% 83% stays exactly on the mark. */
.stage{
  --sh:calc(var(--ls) * 5);                       /* stage height */
  --g:calc((var(--sh) - 4*var(--ls))/5);          /* = 0.2 × --ls  */
  position:relative;
  /* Two letter-boxes wide and pulled half its width left of the block,
     so the stage's own centre lands exactly on the rail - and with it
     the I's stroke, which sits at the dead centre of its 32-unit
     viewBox. Everything downstream follows for free: .lt is at
     50% - ls/2, .pulse at 50% - 2.6ls, perspective-origin at 50%, and
     the WebGL draws at uOrigin(W/2, .83Hh) off its own measured box. No
     landing offset, no projection constant and neither renderer had to
     change. 2x is the tightest the canvas can be without clipping the
     Y at its 1.3154 landing scale. */
  width:calc(var(--ls) * 2);
  margin-left:calc(var(--ls) * -1);
  height:var(--sh);
  flex:none;
  color:var(--text);          /* ONE source of ink for both renderers:
                                 readColor() parses this very property */
  perspective:calc(var(--ls) * 10);   /* was a hard 900px, which drifted
                                         from 9.8× to 12.9× across
                                         viewports — the 3D read
                                         differently on every screen */
  perspective-origin:50% 83%;
  margin-bottom:clamp(26px,4.2svh,52px);
}
/* The match, as light: a hot core inside a soft bloom, 110ms attack
   then 2.4s of decay to nothing. It is an EVENT — it leaves no
   residue. (The old rule ended at opacity:.55 with fill:both over a
   base opacity of .55, so the halo became permanent green wallpaper
   from 9.8s on; and because reduced-motion strips animations, that
   base value showed as a static green blob from the very first frame.)
   Box centre must sit on the landing anchor: for a box of k×ls,
   top = 4g + (3.346 − k/2)·ls. At k=5.2 that is 4g + 0.746·ls. */
.pulse{
  position:absolute;
  width:calc(var(--ls)*5.2);height:calc(var(--ls)*5.2);
  left:calc(50% - var(--ls)*2.6);
  top:calc(4*var(--g) + .746*var(--ls));
  border-radius:50%;
  background:
    radial-gradient(closest-side, var(--pulse-core), transparent 38%) 50% 50%/calc(var(--ls)*1.2) calc(var(--ls)*1.2) no-repeat,
    radial-gradient(closest-side, var(--pulse), transparent 66%);
  opacity:0;
  animation:matchPulse 2.6s cubic-bezier(.25,.55,.55,1) 8.2s both;
}
@keyframes matchPulse{
  0%{opacity:0;transform:scale(.5)}
  9%{opacity:1;transform:scale(1.02)}
  100%{opacity:0;transform:scale(1.34)}
}
.lt{
  position:absolute;
  width:var(--ls);height:var(--ls);
  left:calc(50% - var(--ls)/2);
  transform-style:preserve-3d;
  transform:translate(var(--tx,0px), var(--ty,0px)) scale(var(--sc,1));
}
.spin{display:block;width:100%;height:100%}
.spin svg{width:100%;height:100%}
/* WebGL upgrade: real tubular 3D letters (capsule meshes) drawn on a
   canvas over the stage, driven by the same timeline and easing
   curves as the CSS letters. When the context initializes, .has-gl
   hides the flat DOM letters; otherwise they remain as the fallback. */
#glc{position:absolute;inset:0;width:100%;height:100%;display:none}
.has-gl #glc{display:block}
.has-gl .lt{display:none}
.l1{
  top:calc(1*var(--g) + 0*var(--ls));
  --ty:calc(3*(var(--g) + var(--ls)) - var(--ls)*.1554);
  --sc:1.3154;
  animation:converge 5s cubic-bezier(.37,0,.63,1) .8s both;
}
.l2{
  top:calc(2*var(--g) + 1*var(--ls));
  --ty:calc(2*(var(--g) + var(--ls)) - var(--ls)*.2957);
  --sc:1.2081;
  animation:converge 5s cubic-bezier(.37,0,.63,1) 1.2s both;
}
.l3{
  top:calc(3*var(--g) + 2*var(--ls));
  --ty:calc(1*(var(--g) + var(--ls)) - var(--ls)*.4517);
  --sc:1.2054;
  animation:converge 5s cubic-bezier(.37,0,.63,1) 1.6s both;
}
.l4{
  /* The I: fixed. No translate, no scale, no spin — the anchor of the
     mark, square to the viewer the whole way through. */
  top:calc(4*var(--g) + 3*var(--ls));
}
@keyframes converge{
  from{transform:translate(0px, 0px) scale(1)}
  to{transform:translate(var(--tx,0px), var(--ty,0px)) scale(var(--sc,1))}
}
/* One unbroken rotation per spinning letter, ending at rest at 10.4s.
   Spin-ups are STAGGERED in reading order at even 1s intervals — Y
   1.2s, U 2.2s, M 3.2s — and every pre-sync ramp is the SAME curve,
   cubic-bezier(.333,0,.667,.333), which is exactly y = x²: constant
   angular acceleration, so the speed climbs in a straight line from
   nothing. Each letter has less runway than the one before, so each
   accelerates harder (103 / 120 / 144 °/s²) and all three hit 720°/s
   together at the 8.2s sync — 7, 6 and 5 turns covered over very
   different windows, which keeps the phases scrambled until then. The
   final 720° (2.2s, same curve for all) picks up at exactly that
   720°/s — the settle curve's initial slope is 2.2, matching the
   ramp's exit speed, so there is no seam at the sync — and
   decelerates them to rest on the I. Every total is a whole number of
   turns (9/8/7), so all three land face-on. The I gets no spin rule
   at all — it never turns, so there is nothing here for .l4. */
.l1 .spin{animation:spinY 9.2s linear 1.2s both}
.l2 .spin{animation:spinU 8.2s linear 2.2s both}
.l3 .spin{animation:spinM 7.2s linear 3.2s both}
@keyframes spinY{
  0%{transform:rotateY(0deg);animation-timing-function:cubic-bezier(.333,0,.667,.333)}
  76.087%{transform:rotateY(2520deg);animation-timing-function:cubic-bezier(.25,.55,.55,1)}
  100%{transform:rotateY(3240deg)}
}
@keyframes spinU{
  0%{transform:rotateY(0deg);animation-timing-function:cubic-bezier(.333,0,.667,.333)}
  73.171%{transform:rotateY(2160deg);animation-timing-function:cubic-bezier(.25,.55,.55,1)}
  100%{transform:rotateY(2880deg)}
}
@keyframes spinM{
  0%{transform:rotateY(0deg);animation-timing-function:cubic-bezier(.333,0,.667,.333)}
  69.444%{transform:rotateY(1800deg);animation-timing-function:cubic-bezier(.25,.55,.55,1)}
  100%{transform:rotateY(2520deg)}
}

/* ── Type — one family, one weight, two sizes ─────────────────────────
   Hierarchy comes from size (3.2:1) and opacity (100% / 62%), never
   from weight. The mark's stroke is 32.0833/450 = 7.1% of its width, a
   monoline; an 800 headline underneath it out-shouts the logo it is
   supposed to be serving. A 400 headline at 48px matches the mark's
   colour and buys its confidence from scale instead.
   Both slots still reserve their height. There is no webfont swap left
   to guard against, but a line-break change will still shift the
   composition mid-ritual, and Helvetica sets about 1.5% wider than the
   face these reserves were measured against — so the reserves earn
   their keep on the second count alone. */
h1{
  font-size:clamp(1.625rem, .95rem + 2.35vw, 3rem);
  font-weight:400;line-height:1.1;letter-spacing:-.02em;
  max-width:min(42rem,88vw);text-wrap:balance;
  min-height:2.2em;display:grid;place-items:center;
  animation:cut .001s steps(1,jump-start) 8.2s both;
}
h1 em{font-style:normal;color:var(--accent-text)}
@media (max-width:480px){h1{letter-spacing:-.01em}}
/* At 320px a 96px rail leaves 200px of column, which is three lines of
   .say and an h1 that will not fit its reserve. Shrinking the letter box
   shrinks the rail with it - --rail is derived from --ls - and hands
   25px back to the text. */
@media (max-width:360px){:root{--ls:44px;--rail:80px}}   /* 1.716x44 = 75.5 */
/* The only hard cut on a page where everything else eases — landing on
   the same frame as the pulse is what makes the two read as one event
   rather than a caption arriving after one. steps(1,jump-start), not
   steps(1,end): "end" would fire a whole duration late. */
@keyframes cut{from{opacity:0}to{opacity:1}}

/* The caption and the clarifier share ONE grid cell at the same size,
   colour and position, so the 7.0s → 9.6s handoff cannot shift, jump
   or collide. */
.micro{
  display:grid;
  font-size:.9375rem;min-height:2.9em;   /* em must resolve against the
                                            micro size, not the 16px root */
  width:100%;
  margin-bottom:clamp(28px,5svh,84px);   /* the reserve before the payoff */
}
.micro > *{grid-area:1/1}
.cap,.say,.status{
  font-size:.9375rem;font-weight:400;line-height:1.45;letter-spacing:.015em;
  color:var(--text-2);text-wrap:pretty;
}
/* One animation, not a fade-in plus a fade-out: two animations on one
   property would have the second's backwards fill override the first
   from page load. */
/* -- The copy clock, front-loaded --------------------------------
   The old order spent its first 2.8 seconds silent and did not name the
   mechanic until 9.6s, so a stranger who left at four seconds - which
   is most of them - had read one sentence and learned nothing. Now the
   mechanic lands at 0.9s and the whole proposition is on screen by 4.2.
   Only the headline is still withheld, and it is withheld to 8.2 for
   the same reason as before: it must land on the pulse frame.
   .cap no longer fades out. It was written as narration for a ritual;
   it is in fact a true statement about the product, so it stays - and
   it is no longer aria-hidden, which also returns half the proposition
   to every screen-reader visitor. */
.cap{
  margin-bottom:clamp(14px,2.4svh,26px);
  animation:fade .9s cubic-bezier(.25,.55,.55,1) 1.8s both;
}
/* The invitation is not timed off the rail like the others. It appears
   when the ring's trace comes back round to the rail - the 6 o'clock
   crossing, half a circle after it set off from 12. The control has
   just drawn half of itself around the mark, and that is the moment to
   say what the mark is for.
   10.83s is solved, not guessed. The ring runs 1.6s from 10.4s on
   cubic-bezier(.25,.55,.55,1); the trace is half drawn when the EASED
   progress hits .5, which for that curve is at t=.3306 of the bezier
   parameter and therefore 26.8% of the elapsed duration - not 50%.
   10.4 + .268 x 1.6 = 10.829. */
.say{animation:fade .9s cubic-bezier(.25,.55,.55,1) 10.83s both}
/* No box, no border, no radius, no hover, no cursor — it is a sentence,
   not a button. Opacity only: after ten seconds of choreography a
   stock 12px fade-up is the wrong final gesture. The last element
   should simply become present. */
/* Out of the block and down to the foot of the page. It is not part of
   the argument - the argument is cap, mark, mechanic, payoff - it is a
   note about where to find the thing, so it sits apart from the
   composition, on the rail, at the bottom of the last grid row. */
.status{
  grid-row:3;align-self:end;
  margin-left:var(--rail);
  animation:fade .9s cubic-bezier(.25,.55,.55,1) 10.7s both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* -- The mark becomes the control --------------------------------
   Nothing is pressable while the ritual is running. At 10.4s, the frame
   the letters come to rest, a ring draws itself around the mark and the
   mark is a target from that moment on. The arming is a CSS animation
   rather than a script, so it holds with JavaScript off - the same
   steps(1,jump-start) idiom the headline already uses.
   Keyboard and assistive technology are deliberately NOT gated. The
   ring is a visual invitation, and a visitor who cannot see it should
   not have to wait ten seconds for a control that already exists.
   Geometry: the button is concentric with the pulse, whose box is 5.2ls
   centred on the landing anchor at 4g + 3.346ls. At 2.15ls across it
   clears the assembled mark - 1.20ls wide by 1.30ls tall, so 0.886ls to
   its furthest corner - by 0.189ls, and it is 112px across on a phone.

   The only thing on this page you can do, and it gives you nothing.
   Press it and the sentence is replaced by the truth: nothing happens
   now. No pulse, no green, no second act - a receipt would make the
   send observable, and unobservable is the one property a Yumi has. */
.mark{
  position:absolute;
  width:calc(var(--ls) * 2.15);height:calc(var(--ls) * 2.15);
  left:calc(50% - var(--ls) * 1.075);
  /* 2.271 would put the ring's centre on the landing anchor, and that
     is measurably centred - glyph-to-ring offset .01px across, .17px
     down, clearances 34.7 top against 35.0 bottom. It still reads high,
     because the mark's ink is not evenly spread through its own box:
     the two wide chevrons fill the top and only a thin stem descends.
     Weighted by stroke length the centre of mass sits 46.7 of 489 units
     - 0.125 x --ls - ABOVE the bounding centre. So the ring is raised
     by 0.10, most of the way to the mass and short of it: past that the
     gap above the chevron overshoots the other way. Optical, not
     geometric, and the only number on this page chosen by eye. */
  top:calc(4 * var(--g) + 2.171 * var(--ls));
  background:none;border:0;margin:0;padding:0;border-radius:50%;
  cursor:pointer;pointer-events:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  animation:arm .001s steps(1,jump-start) 10.4s both;
}
@keyframes arm{from{pointer-events:none}to{pointer-events:auto}}
.mark:focus-visible{outline-offset:5px}
.ring{position:absolute;inset:0;display:block;overflow:visible}
/* The dash is stated in the circle's own units, not normalised.
   pathLength="100" looks like the right tool and is not: Chrome does
   not apply pathLength normalisation to a stroke-dasharray set in CSS
   - measured, the computed value came back as 100 USER units against a
   real circumference of 301.11, which painted the ring as two arcs
   separated by two gaps. 2 x pi x 48 = 301.59, so 302 covers it.
   Stroke width is in viewBox units too, so it scales with the ring
   rather than staying a fixed hairline: 1.0px next to a 4.4px mark
   stroke on a phone, 2.0 next to 8.9 on a laptop - the same 22% ratio
   at every size, which is what makes it read as an affordance rather
   than as part of the mark.
   It is drawn in --text, never green: green is spent in three places
   on this page and all three mean a match. An affordance is not a
   match. */
.ring circle{
  fill:none;stroke:var(--hair);stroke-width:.9;
  stroke-dasharray:302;stroke-dashoffset:302;
  transform:rotate(-90deg);transform-origin:50% 50%;
  animation:draw 1.6s cubic-bezier(.25,.55,.55,1) 10.4s both;
}
@keyframes draw{to{stroke-dashoffset:0}}
.mark:hover .ring circle,
.mark:focus-visible .ring circle{stroke:var(--text)}
/* Sent: the affordance is withdrawn because the act is spent. That is
   the opposite of a reward, and it is the only feedback there is. */
.is-sent .mark{pointer-events:none}
.is-sent .ring{opacity:0;transition:opacity .6s linear}
.ans{visibility:hidden;opacity:0}
.is-sent .say{visibility:hidden;opacity:0;transition:opacity .2s linear}
.is-sent .ans{visibility:visible;opacity:1;transition:opacity .28s linear .06s}

/* ── Short and wide: landscape phones ─────────────────────────────────
   The --ls floor is height-blind. min(11.5svh, 8.6vw) never wins on a
   phone — 8.6vw only reaches 52px at a 605px viewport — so --ls sat on
   its 52px floor and the stage stayed a hard 260px at EVERY viewport,
   portrait and landscape alike. Inside a 390px-tall landscape window
   that is two thirds of the screen spent before the headline starts:
   measured, the page ran 141px past the fold at 844×390 and .micro and
   .status were off-screen at every landscape size there is.
   Here the letter box follows the HEIGHT instead of the width, and
   every reserve below it tightens in step. 600px, not 520px, is the
   real cut: the default h1 grows with 2.35vw while the height does not
   follow, so a wide-and-short window overflows long after the phones
   do — 1200×500 overspends by 38px on the headline alone. */
@media (orientation: landscape) and (max-height: 600px){
  main{padding-block:clamp(8px,2svh,20px)}
  :root{--ls:clamp(24px, 8svh, 52px)}
  .cap{margin-bottom:clamp(8px,2svh,18px)}
  .stage{margin-bottom:clamp(10px,2.5svh,28px)}
  h1{font-size:clamp(1.125rem, .8rem + 1.4vw, 1.75rem)}
  /* the say/ans pair is one line at this width, so the two-line reserve
     is 22px of dead height a landscape phone cannot spare */
  .micro{min-height:1.5em;margin-bottom:clamp(14px,4svh,40px)}
  /* 844/915/932 are all above the 820px cut, so landscape phones never
     picked up the phone speck sizing — restate it here. */
  .sp{width:calc(var(--s) * .6);height:calc(var(--s) * .6)}
  .sp:nth-child(2n){display:none}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  /* Position is carried entirely by the drift keyframe, so a blanket
     animation:none would stack all 64 specks in a strip at the top.
     Delete the field rather than freeze it. */
  .field{display:none}
  .pulse{display:none}
  h1,.cap,.say,.status{opacity:1}
  /* the arming animation is gone with every other one, so state the
     end of it outright */
  .mark{pointer-events:auto}
  .ring circle{stroke-dashoffset:0}
  .rail{transform:scaleY(1)}
}

<script>
/* Tubular 3D letters — raw WebGL, no libraries. Each stroke becomes a
   capsule mesh (cylinder + hemispherical caps = the SVG round linecaps
   in 3D). The scene mirrors the CSS system exactly: same slots, same
   landing transforms, same easing curves and timeline, and a CSS-style
   perspective projection (origin 50%/83%) so the geometry sits in the
   page like the DOM letters did. If init fails, the flat CSS letters
   keep running. */
(function(){
  var stage=document.querySelector('.stage'), canvas=document.getElementById('glc');
  if(!stage||!canvas)return;
  var gl=null;
  try{gl=canvas.getContext('webgl',{alpha:true,antialias:true})}catch(e){}
  if(!gl)return;

  /* uPersp replaces a hard-coded 900: the CSS perspective is now
     10 × --ls, so the projection has to follow it or the tubes read at
     a different depth than the stage was built for. */
  var VS='attribute vec3 aPos;attribute vec3 aNrm;'+
  'uniform vec2 uTrans;uniform float uScale;uniform float uAngle;'+
  'uniform vec2 uRes;uniform vec2 uOrigin;uniform float uPersp;'+
  'void main(){'+
  ' float c=cos(uAngle),s=sin(uAngle);'+
  ' vec3 p=vec3(aPos.x*c+aPos.z*s,aPos.y,-aPos.x*s+aPos.z*c);'+
  ' p=vec3(p.x*uScale+uTrans.x,p.y*uScale+uTrans.y,p.z*uScale);'+
  ' float w=(uPersp-p.z)/uPersp;'+
  ' float hx=uRes.x*0.5,hy=uRes.y*0.5;'+
  ' gl_Position=vec4(w*((uOrigin.x-hx)/hx)+(p.x-uOrigin.x)/hx,'+
  '  -(w*((uOrigin.y-hy)/hy)+(p.y-uOrigin.y)/hy), -p.z/200.0*w, w);}';
  /* Flat material by design: no shading, no gloss — the 3D reads
     through the silhouette alone, so the tubes match the brand's flat
     monoline mark exactly. */
  var FS='precision mediump float;uniform vec3 uColor;'+
  'void main(){gl_FragColor=vec4(uColor,1.0);}';
  function mk(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
  var prog;
  try{
    prog=gl.createProgram();
    gl.attachShader(prog,mk(gl.VERTEX_SHADER,VS));
    gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FS));
    gl.bindAttribLocation(prog,0,'aPos');gl.bindAttribLocation(prog,1,'aNrm');
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);
  }catch(e){return}
  gl.useProgram(prog);
  var U={};['uTrans','uScale','uAngle','uRes','uOrigin','uColor','uPersp'].forEach(function(k){U[k]=gl.getUniformLocation(prog,k)});
  gl.enable(gl.DEPTH_TEST);
  stage.classList.add('has-gl');

  /* CSS cubic-bezier easing */
  function bez(x1,y1,x2,y2){
    var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
    function sx(t){return((ax*t+bx)*t+cx)*t}
    function dx(t){return(3*ax*t+2*bx)*t+cx}
    function sy(t){return((ay*t+by)*t+cy)*t}
    return function(x){
      if(x<=0)return 0; if(x>=1)return 1;
      var t=x,i,e,d;
      for(i=0;i<6;i++){e=sx(t)-x;if(Math.abs(e)<1e-5)return sy(t);d=dx(t);if(Math.abs(d)<1e-6)break;t-=e/d}
      if(t<0||t>1||Math.abs(sx(t)-x)>1e-4){var lo=0,hi=1;while(hi-lo>1e-5){t=(lo+hi)/2;if(sx(t)<x)lo=t;else hi=t}}
      return sy(t)};
  }
  /* EA is exactly y = x² — constant angular acceleration. EC settles
     the spin, entering at 2.2× its average (= the 720°/s the ramp
     leaves off at) and easing to a dead stop. */
  var ECONV=bez(.37,0,.63,1),EA=bez(.333,0,.667,.333),EC=bez(.25,.55,.55,1);

  /* Same glyph strokes as the SVG defs, in viewBox units */
  var LETTERS=[
    {w:449,h:490,segs:[[16,16,224.5,131.8],[433,16,224.5,131.8],[224.5,131.8,224.5,473.3]]},
    {w:449,h:384,segs:[[16,16,16,251.6],[433,16,433,251.6],[16,251.6,224.5,367.4],[224.5,367.4,433,251.6]]},
    {w:449,h:268,segs:[[16,251.6,16,16],[16,16,224.5,131.8],[224.5,131.8,433,16],[433,16,433,251.6]]},
    {w:32,h:374,segs:[[16,16,16,357.3]]}
  ];
  /* Same timeline as the CSS: descents .8/1.2/1.6 + 5s; sync 8.2; rest 10.4 */
  var CDEL=[.8,1.2,1.6,null];
  /* Spin-ups start 1s apart and share the one constant-acceleration
     curve; the shorter the runway, the steeper the ramp, so all three
     reach 720°/s at the 8.2s sync and settle 720° more to rest. The
     I's null entry is the point: it never turns. */
  var SPINS=[
    [[1.2,8.2,0,2520,EA],[8.2,10.4,2520,3240,EC]],
    [[2.2,8.2,0,2160,EA],[8.2,10.4,2160,2880,EC]],
    [[3.2,8.2,0,1800,EA],[8.2,10.4,1800,2520,EC]],
    null
  ];
  var END=10.45;

  /* Capsule mesh: rings from pole A over both hemispheres to pole B */
  var RN=18,CB=6;
  function capsule(ax,ay,bx,by,r,pos,nrm,idx){
    var dx0=bx-ax,dy0=by-ay,len=Math.sqrt(dx0*dx0+dy0*dy0),ux=dx0/len,uy=dy0/len;
    var base=pos.length/3,rings=[],j,al;
    for(j=0;j<=CB;j++){al=Math.PI/2*(1-j/CB);
      rings.push([ax-ux*r*Math.sin(al),ay-uy*r*Math.sin(al),r*Math.cos(al),-Math.sin(al),Math.cos(al)])}
    for(j=0;j<=CB;j++){al=Math.PI/2*(j/CB);
      rings.push([bx+ux*r*Math.sin(al),by+uy*r*Math.sin(al),r*Math.cos(al),Math.sin(al),Math.cos(al)])}
    rings.forEach(function(rg){
      for(var k=0;k<RN;k++){var ph=2*Math.PI*k/RN,cp=Math.cos(ph),sp=Math.sin(ph);
        pos.push(rg[0]+rg[2]*(-uy*cp),rg[1]+rg[2]*(ux*cp),rg[2]*sp);
        nrm.push(ux*rg[3]+(-uy*cp)*rg[4],uy*rg[3]+(ux*cp)*rg[4],sp*rg[4])}});
    for(j=0;j<rings.length-1;j++)for(var k=0;k<RN;k++){
      var a=base+j*RN+k,b=base+j*RN+(k+1)%RN,c=a+RN,d=b+RN;
      idx.push(a,c,b,b,c,d)}
  }

  var W=0,Hh=0,ls=0,gp=0,bufs=[],targ=[];
  function build(){
    /* Supersample: at least 2x backing resolution even on 1x displays —
       the scene is tiny, and downscaling is what keeps tube edges as
       crisp as the SVG letters were. */
    var dpr=Math.min(Math.max(window.devicePixelRatio||1,2),3);
    var rect=stage.getBoundingClientRect();
    W=rect.width;Hh=rect.height;
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(Hh*dpr);
    /* --sh is pinned to 5 × --ls, so the measured stage height IS the
       letter box times five. Deriving ls from the measurement instead
       of re-implementing the CSS clamp here means the two can never
       drift apart — and gp then resolves to exactly 0.2 × ls, matching
       --g. */
    ls=Hh/5;
    gp=(Hh-4*ls)/5;
    bufs.forEach(function(b){gl.deleteBuffer(b.vb);gl.deleteBuffer(b.ib)});
    bufs=[];targ=[];
    LETTERS.forEach(function(L,i){
      var k=ls/Math.max(L.w,L.h),xo=(ls-L.w*k)/2-ls/2,yo=(ls-L.h*k)/2-ls/2;
      var pos=[],nrm=[],idx=[];
      L.segs.forEach(function(sg){capsule(sg[0],sg[1],sg[2],sg[3],16,pos,nrm,idx)});
      var inter=new Float32Array(pos.length*2);
      for(var v=0;v<pos.length/3;v++){
        inter[v*6]=pos[v*3]*k+xo;inter[v*6+1]=pos[v*3+1]*k+yo;inter[v*6+2]=pos[v*3+2]*k;
        inter[v*6+3]=nrm[v*3];inter[v*6+4]=nrm[v*3+1];inter[v*6+5]=nrm[v*3+2]}
      var vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,inter,gl.STATIC_DRAW);
      var ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
      bufs.push({vb:vb,ib:ib,n:idx.length});
      var ci=(i+1)*gp+(i+.5)*ls;
      var TX=[0,0,0,0][i];
      var TY=[3*(gp+ls)-.1554*ls,2*(gp+ls)-.2957*ls,(gp+ls)-.4517*ls,0][i];
      var SC=[1.3154,1.2081,1.2054,1][i];
      targ.push({cy:ci,tx:TX,ty:TY,sc:SC})});
  }
  var col=[1,1,1];
  function readColor(){
    var m=getComputedStyle(stage).color.match(/(\d+),\s*(\d+),\s*(\d+)/);
    if(m)col=[m[1]/255,m[2]/255,m[3]/255];
  }
  function angleAt(i,t){
    var sc=SPINS[i];
    if(!sc||t<=sc[0][0])return 0;
    for(var j=0;j<sc.length;j++){var s=sc[j];
      if(t<s[1])return(s[2]+(s[3]-s[2])*s[4]((t-s[0])/(s[1]-s[0])))*Math.PI/180}
    return sc[sc.length-1][3]*Math.PI/180;
  }
  function draw(t){
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.uniform2f(U.uRes,W,Hh);gl.uniform2f(U.uOrigin,W/2,.83*Hh);gl.uniform3fv(U.uColor,col);
    gl.uniform1f(U.uPersp,10*ls);
    for(var i=0;i<4;i++){
      var tg=targ[i],e=0;
      if(CDEL[i]!==null)e=ECONV(Math.min(Math.max((t-CDEL[i])/5,0),1));
      gl.uniform2f(U.uTrans,W/2+tg.tx*e,tg.cy+tg.ty*e);
      gl.uniform1f(U.uScale,1+(tg.sc-1)*e);
      gl.uniform1f(U.uAngle,angleAt(i,t));
      gl.bindBuffer(gl.ARRAY_BUFFER,bufs[i].vb);
      gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);
      gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bufs[i].ib);
      gl.drawElements(gl.TRIANGLES,bufs[i].n,gl.UNSIGNED_SHORT,0)}
  }
  var lastT=0;
  function frame(t){lastT=t;draw(t)}
  readColor();build();
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(rm){frame(END)}
  else{
    var t0=performance.now();
    (function loop(){
      var t=(performance.now()-t0)/1000;
      frame(Math.min(t,END));
      if(t<END)requestAnimationFrame(loop);
    })();
  }
  addEventListener('resize',function(){build();frame(lastT)});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){readColor();frame(lastT)});
})();
</script>

<script>
/* The line is the clock, so the copy is timed off the line rather than
   off a list of constants. Only the ratio matters: an element at 57% of
   the viewport height appears at 57% of the trace. The headline is the
   one fixed point - it stays on 8.2s, because it has to land on the
   same frame as the pulse - and the trace duration is solved backwards
   from wherever the headline actually sits at this viewport.
   Runs in a rAF so it measures settled layout. Does nothing under
   reduced motion, where there is no trace to sync to, and nothing if
   the geometry comes back implausible - in both cases the CSS defaults
   stand. */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  requestAnimationFrame(function(){
    var h1=document.querySelector('h1'),rail=document.querySelector('.rail');
    if(!h1||!rail)return;
    var H=innerHeight,f=h1.getBoundingClientRect().top/H;
    if(!(f>.15&&f<.95))return;
    var T=Math.min(16,Math.max(9,8.2/f));
    rail.style.animationDuration=T.toFixed(2)+'s';
    /* .say is deliberately absent here: it belongs to the ring, not to
       the rail, and its 10.83s is a fixed point like the headline's 8.2.
       The status is clamped to land after it - on a wide screen the rail
       reaches the foot of the page at 9.5s, which would otherwise put
       the closing line on screen before the invitation above it. */
    var SAY=10.83;
    [['.cap',0],['.status',SAY+.35]].forEach(function(p){
      var el=document.querySelector(p[0]);if(!el)return;
      var t=Math.max(T*el.getBoundingClientRect().top/H, p[1]);
      el.style.animationDelay=t.toFixed(2)+'s';
    });
  });
})();
</script>

<script>
/* The send. pointerdown rather than click: it should land under the
   thumb, not after it lifts. Nothing is persisted and nothing can be
   undone, because you cannot un-send a Yumi. */
(function(){
  var b=document.querySelector('.mark');
  if(!b)return;
  function sent(e){ if(e)e.preventDefault();
    document.documentElement.classList.add('is-sent') }
  b.addEventListener('pointerdown',sent);
  b.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter')sent(e) });
})();
</script>
